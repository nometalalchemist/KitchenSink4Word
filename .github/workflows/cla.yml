name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA.md of this repository and agree to its terms.') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'cla-signatures'
          custom-notsigned-comment: 'Thanks for the contribution. Before this can merge, please read [CLA.md](../blob/main/CLA.md) and sign by replying with the sentence below.'
          custom-pr-sign-comment: 'I have read the CLA.md of this repository and agree to its terms.'
          custom-allsigned-comment: 'All contributors have signed the CLA.'
          allowlist: 'nometalalchemist,bot*,dependabot[bot]'
